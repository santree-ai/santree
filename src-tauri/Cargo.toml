[package]
name = "santree"
description = "santree desktop app — thin Tauri adapter over santree-core."
authors = ["Santiago Toscanini"]
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# linker quirk: https://github.com/rust-lang/cargo/issues/8519).
name = "santree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
santree-core = { path = "../crates/core" }
santree-pty = { path = "../crates/pty" }

tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Guards against two instances fighting over the same santree.db (last-writer-wins
# on settings) — a real risk on Linux, which has no OS-level single-instance
# enforcement the way macOS's Dock/LaunchServices give app bundles for free.
tauri-plugin-single-instance = "2"

# Self-update from the GitHub releases the release workflow publishes. Both
# channels (stable / beta) are served by one binary — see src/update.rs for why
# the endpoint is chosen at runtime rather than read from tauri.conf.json.
tauri-plugin-updater = "2"

serde = { workspace = true }
serde_json = { workspace = true }

# Typed Rust <-> TS bridge. specta describes the types; tauri-specta wires them
# into a Builder and emits `src/bindings.ts`.
specta = { workspace = true }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Async runtime — used pervasively (every #[tauri::command] is async, plus sqlx,
# reqwest, and PTY streaming). We only need `spawn`/`spawn_blocking` (rt),
# `join!`/#[tokio::test] (macros), and tokio::sync::Mutex (sync) — no signal/net/
# io-std/etc, which "full" pulled in unused. Tauri and sqlx pull in whatever
# additional tokio features they themselves need via Cargo's feature unification;
# this list only has to cover what our own code names directly.
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

anyhow = { workspace = true }

# Parse user-configured `.env` files into KEY=VALUE pairs (without mutating our
# own process env) for the Environment settings — see `env.rs`.
dotenvy = "0.15"

# Stable session UUIDs for resumable agent terminals (Claude `--session-id`).
uuid = { version = "1", features = ["v4"] }

# Concurrent fan-out (`join_all`) for inlining comment images in parallel.
futures = "0.3"

# Parsing Linear's RFC3339 timestamps (SLA / snooze / created / on-call shifts).
# `clock` adds the local-timezone offset, needed to bucket usage by the user's
# own "today"/this-week rather than UTC (see usage.rs). Small feature flag on an
# already-present dep — not a new dependency.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Logging via the `log` facade, persisted to a file (+ stdout) by tauri-plugin-log
# so Rust and JS-console logs land in one attachable file. See `lib.rs`.
log = { workspace = true }
tauri-plugin-log = "2"

# Linear integration: HTTP (GraphQL/OAuth) + PKCE primitives.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Percent-decode the OAuth callback query string (already in the tree via reqwest).
form_urlencoded = "1"

# Local app database (tokens, repo links, settings).
sqlx = { workspace = true, features = ["migrate", "macros"] }
# Filesystem watcher for the Trees "Changes" view: notify wraps the native
# backend (FSEvents/inotify); the debouncer collapses event bursts. See git_watch.rs.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Jinja/Nunjucks-style templating for the AI prompts (commit / PR / work), kept as
# readable files under prompts/ and rendered in prompts.rs.
minijinja = "2"

# Run the setup script under a PTY so its children (nix/make/…) see a TTY and emit
# output live instead of block-buffering into a pipe. Same crate crates/pty uses.
portable-pty = { workspace = true }

# Linear OAuth tokens live in the OS keychain (macOS Keychain / freedesktop Secret
# Service), never in santree.db — see CLAUDE.md's secrets invariant and linear.rs.
# Default features are exactly the two native stores we target plus the `Entry` API.
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
# Repositions the macOS traffic lights (the `trafficLightPosition` config field is
# ignored with titleBarStyle: Overlay); decorum does it natively + on resize.
#
# macOS-only on purpose: `set_traffic_lights_inset` is the single thing we call from
# it and it's already behind `#[cfg(target_os = "macos")]` in lib.rs, while on Linux
# decorum pulls in linicon → memmap2 0.5 (RUSTSEC-2026-0186, unsound, no fix on the
# 0.5 line) — an unsound crate compiled into the Linux binary to power nothing.
tauri-plugin-decorum = "1.1"
