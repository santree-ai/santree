[package]
name = "santree"
description = "santree desktop app — thin Tauri adapter over santree-core."
authors = ["Santiago Toscanini"]
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# linker quirk: https://github.com/rust-lang/cargo/issues/8519).
name = "santree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
santree-core = { path = "../crates/core" }
santree-pty = { path = "../crates/pty" }
# The link to santree-remote on Daedalus (docs/remote.md).
santree-remote-client = { path = "../crates/remote" }
# The hook binary's own "payload → rows" code, as a library: a hook relayed from
# Daedalus is applied by exactly what applies a local one.
santree-hook = { path = "../crates/hook" }
# The local server's peer check (`peer::own_identity`, `peer::verify`) and its
# revision/identifiers: the app is the server's one client, so what the server
# admits and what the app admits are the same code.
santree-server = { path = "../crates/server" }

tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Guards against two instances fighting over the same santree.db (last-writer-wins
# on settings) — a real risk on Linux, which has no OS-level single-instance
# enforcement the way macOS's Dock/LaunchServices give app bundles for free.
tauri-plugin-single-instance = "2"

# Self-update from the GitHub releases the release workflow publishes. Both
# channels (stable / beta) are served by one binary — see src/update.rs for why
# the endpoint is chosen at runtime rather than read from tauri.conf.json.
tauri-plugin-updater = "2"

serde = { workspace = true }
# `preserve_order` is already on via tauri, but global_capture.rs rewrites the
# user's own `~/.claude/settings.json` in place and relies on key order surviving
# the round trip — so it's named here rather than inherited by accident.
serde_json = { workspace = true, features = ["preserve_order"] }

# Typed Rust <-> TS bridge. specta describes the types; tauri-specta wires them
# into a Builder and emits `src/bindings.ts`.
specta = { workspace = true }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Async runtime — used pervasively (every #[tauri::command] is async, plus sqlx,
# reqwest, and PTY streaming). We only need `spawn`/`spawn_blocking` (rt),
# `join!`/#[tokio::test] (macros), tokio::sync::Mutex (sync), and bounded
# provider-version probes (process/io-util) — no signal/net/
# io-std/etc, which "full" pulled in unused. Tauri and sqlx pull in whatever
# additional tokio features they themselves need via Cargo's feature unification;
# this list only has to cover what our own code names directly.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "io-util", "net"] }

# The local server's launch (`pre_exec` fd placement, signals, uid checks) —
# the same crate the server itself and the PTY layer use.
libc = "0.2"

anyhow = { workspace = true }
async-trait = "0.1"

# Parse user-configured `.env` files into KEY=VALUE pairs (without mutating our
# own process env) for the Environment settings — see `env.rs`.
dotenvy = "0.15"

# Stable session UUIDs for resumable agent terminals (Claude `--session-id`).
uuid = { version = "1", features = ["v4"] }

# Concurrent fan-out (`join_all`) for inlining comment images in parallel.
futures = "0.3"

# Parsing Linear's RFC3339 timestamps (SLA / snooze / created / on-call shifts).
# `clock` adds the local-timezone offset, needed to bucket usage by the user's
# own "today"/this-week rather than UTC (see usage.rs). Small feature flag on an
# already-present dep — not a new dependency.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# A TickTick task carries its own IANA zone; its due date is the calendar day in
# that zone, which is not the viewer's zone. Pure Rust, no system tzdata.
chrono-tz = { version = "0.10", default-features = false }

# Logging via the `log` facade, persisted to a file (+ stdout) by tauri-plugin-log
# so Rust and JS-console logs land in one attachable file. See `lib.rs`.
log = { workspace = true }
tauri-plugin-log = "2"

# Linear integration: HTTP (GraphQL/OAuth) + PKCE primitives.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
# NFC for an account folder's path, which names its keychain item (claude_usage.rs).
unicode-normalization = "0.1"
base64 = "0.22"
rand = "0.8"
# Percent-decode the OAuth callback query string (already in the tree via reqwest).
form_urlencoded = "1"
# The Web tab's cookie import reads another browser's own cookie store on this
# Mac (docs/web.md): a Chromium-family browser encrypts each value with
# AES-128-CBC under a key derived (PBKDF2-HMAC-SHA1) from a secret in the login
# Keychain, so the import derives the same key and decrypts only the values it
# copies. All three are already in the tree (ring via rustls).
aes = "0.8"
cbc = "0.1"
ring = "0.17"
# The import copies a browser's cookie file to a private temp dir before reading
# it, since the browser holds the original open (already in the tree).
tempfile = "3"

# Local app database (tokens, repo links, settings).
sqlx = { workspace = true, features = ["migrate", "macros"] }
# Filesystem watcher for the Trees "Changes" view: notify wraps the native
# backend (FSEvents/inotify); the debouncer collapses event bursts. See git_watch.rs.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Jinja/Nunjucks-style templating for the AI prompts (commit / PR / work), kept as
# readable files under prompts/ and rendered in prompts.rs.
minijinja = "2"

# Run the setup script under a PTY so its children (nix/make/…) see a TTY and emit
# output live instead of block-buffering into a pipe. Same crate crates/pty uses.
portable-pty = { workspace = true }

# The remote-TUI listener is WebSocket-over-Unix-socket. Keep the framing local
# (no TLS is needed for an app-private socket) so the control client and TUI can
# share one App Server process.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
socket2 = "0.6"

# Linear OAuth tokens live in the OS keychain (macOS Keychain / freedesktop Secret
# Service), never in santree.db — see AGENTS.md's secrets invariant and linear.rs.
# Default features are exactly the two native stores we target plus the `Entry` API.
keyring = "4"

[dev-dependencies]
# The in-process session host and the fake agent socket, for the Daedalus
# link's tests.
santree-remote-client = { path = "../crates/remote", features = ["fake"] }
# Paused time, so a test of a timer (a setup run's deadline) doesn't wait it out.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Repositions the macOS traffic lights (the `trafficLightPosition` config field is
# ignored with titleBarStyle: Overlay); decorum does it natively + on resize.
#
# macOS-only on purpose: `set_traffic_lights_inset` is the single thing we call from
# it and it's already behind `#[cfg(target_os = "macos")]` in lib.rs, while on Linux
# decorum pulls in linicon → memmap2 0.5 (RUSTSEC-2026-0186, unsound, no fix on the
# 0.5 line) — an unsound crate compiled into the Linux binary to power nothing.
tauri-plugin-decorum = "1.1"

# Reads the login-Keychain secret a Chromium-family browser locks its cookies
# with, so the Web tab's cookie import can decrypt them (already in the tree,
# `keyring`'s macOS backend). Used only through `get_generic_password`.
security-framework = "3"

# The Web tab's browser: a WKWebView santree creates itself and lays over the
# app's own webview (docs/web.md) — not a Tauri webview, whose plugin scripts
# would land in every page. All of these are already in the tree through wry and
# tao, at these versions; listed here with the classes santree's browser names.
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CAShapeLayer",
    "CATransaction",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSHTTPCookie",
    "NSKeyValueObserving",
    "NSObject",
    "NSString",
    "NSURL",
    "NSURLError",
    "NSURLRequest",
    "NSURLResponse",
    "NSUUID",
    "NSValue",
    "NSBundle",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAlert",
    "NSApplication",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKDownload",
    "WKDownloadDelegate",
    "WKFrameInfo",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKOpenPanelParameters",
    "WKPreferences",
    "WKSecurityOrigin",
    "WKSnapshotConfiguration",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKWindowFeatures",
] }
