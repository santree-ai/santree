# Builds the marketing website (website/ — a standalone nested pnpm project)
# and deploys it to GitHub Pages. The site is fully prerendered at build time
# (see website/vite.config.ts), so Pages serves plain static HTML — no server.
#
# PRs get the build as a check; pushes to main deploy. The custom domain
# (santree.toscanini.me) is configured in the repo's Pages settings; the
# committed website/public/CNAME keeps the domain pinned in the artifact.
#
# Convention: third-party actions are pinned to full commit SHAs (same pins as
# ci.yml where shared).
name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (typecheck + prerender)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Reads the pnpm version from website/package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # website/src/routeTree.gen.ts is gitignored (unlike the app's) — it
      # must be generated before tsc sees the tree.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static prerender)
        run: pnpm build

      - name: Assert prerendered pages
        run: |
          test -f .output/public/index.html
          test -f .output/public/docs/index.html
          grep -q "shipped in parallel" .output/public/index.html
          grep -q "docs are growing" .output/public/docs/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.output/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
