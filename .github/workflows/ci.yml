name: CI

# santree ships for macOS only, so the app is built, linted and tested on macOS.
# The one Linux job is for the engine crates (see `engine-linux`).
#
# A change that touches only the paths below runs nothing here: the website has
# its own workflow, release.yml runs on tags, and no build or test reads a
# Markdown file. Anything else runs every job.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - ".agents/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/audit.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - ".agents/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/audit.yml"
      - ".github/workflows/release.yml"

# Nothing here writes back to the repo — CI only reads the checkout.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the `# vX.Y.Z` comment says
# which release it is). A version tag is mutable — whoever owns the action can
# repoint `v4` at new code, which then runs inside our checkout with our token. The
# SHA can't be repointed. Re-pin deliberately, don't float.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The app version is declared in three places that nothing keeps in sync:
      # package.json, tauri.conf.json (what Tauri stamps into the bundle) and the
      # workspace Cargo.toml (what the About box reads via `package_info()`). Drift
      # is invisible until a release ships a DMG whose metadata contradicts itself,
      # so guard it here — same idea as the bindings-drift check in `backend-test`.
      - name: Versions agree (package.json · tauri.conf.json · Cargo.toml)
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          # [workspace.package]'s `version` — the only line starting with `version =`
          # (dependency versions all sit inside inline tables).
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$crate"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$crate" ]; then
            echo "::error::app version disagrees across package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi

      # Version is read from package.json's `packageManager` field, so it
      # can't drift from what contributors get via corepack locally.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome: lint + format check + import sorting (same as `pnpm lint`).
      - run: pnpm lint

      # tsc --noEmit + production Vite build.
      - run: pnpm build

      # The screenshot and demo fixture worlds are dev-only by build-time
      # constants; prove the bundle that just built carries none of them.
      - run: pnpm check:no-demo

      # tsconfig.json excludes the test files, and vitest transpiles them with
      # esbuild (which strips types without checking them) — so without this they
      # are type-checked nowhere and drift silently against bindings.ts.
      - run: pnpm typecheck:test

      - run: pnpm test

  # fmt + clippy run beside the tests rather than before them: clippy's check
  # metadata is no use to the test build, so in one job they were ~1 min of
  # serial work on the critical path.
  backend-lint:
    name: Backend lint (fmt · clippy)
    runs-on: macos-latest
    env:
      # Same as `backend-test`, so the two jobs' dependency builds agree.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The exact toolchain version + components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — the single source of truth. `rustup show` reads that
      # file and auto-installs the pinned toolchain if it isn't already present
      # (GitHub-hosted runners ship rustup + a floating "stable" by default, which
      # this overrides for every cargo invocation below).
      - name: Install pinned Rust toolchain
        run: rustup show

      # First, and cheap: clippy and the tests pass on unformatted code.
      - name: Format check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # tauri.conf.json declares the hook and the server binaries as bundle
      # resources, and Tauri's build script hard-errors ("resource path ...
      # doesn't exist") when a declared resource is missing — so every cargo
      # command on src-tauri needs them staged first. The bundle job gets this
      # via `beforeBuildCommand` (`pnpm bundle:binaries`); these jobs are pure
      # cargo, so they do the same build+copy rather than pulling node/pnpm in.
      # Debug is fine — nothing runs the binaries, the build script only checks
      # that the paths exist.
      - name: Stage the bundle resources
        run: |
          cargo build -p santree-hook -p santree-server
          mkdir -p target/bundle-resources
          cp target/debug/santree-hook target/debug/santree-server target/bundle-resources/

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    name: Backend test (revision lock · tests · bindings drift)
    runs-on: macos-latest
    env:
      # Full debuginfo is most of what a test build writes and links, and CI
      # never attaches a debugger; line tables keep file:line in a panic's
      # backtrace. (A CARGO_* var is part of rust-cache's key, so a change here
      # starts a fresh cache rather than mixing builds.)
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # See `backend-lint`.
      - name: Stage the bundle resources
        run: |
          cargo build -p santree-hook -p santree-server
          mkdir -p target/bundle-resources
          cp target/debug/santree-hook target/debug/santree-server target/bundle-resources/

      # `cargo test --workspace` below runs this too; named on its own so a server
      # change without a REVISION bump fails with a legible step name. The fix is in
      # docs/server.md ("Versions and draining").
      - name: Server revision lock (REVISION matches the server's sources)
        run: cargo test -p santree-server --test revision

      - name: Tests
        run: cargo test --workspace

      # `cargo test` re-runs the bindings export (export_bindings_succeeds), which
      # rewrites src/bindings.ts. If the committed file is stale, this fails —
      # forcing `pnpm gen:bindings` to be run + committed when a command changes.
      - name: Bindings are up to date
        run: git diff --exit-code src/bindings.ts

  # The engine crates are the one part of this workspace that runs on Linux: the
  # daedalus engine depends on them by git rev and builds them there, with nix,
  # on rustc 1.95 (AGENTS.md, "Crates the daedalus engine consumes"). None of
  # them links Tauri or a webview, so this needs no system packages. The 1.95
  # check is what keeps their `rust-version` honest; it resolves against this
  # workspace's Cargo.lock, not the engine's, so a dependency bump that needs a
  # newer rustc fails here first.
  engine-linux:
    name: Engine crates on Linux (clippy · test · rustc 1.95)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      ENGINE_CRATES: -p santree-pty -p santree-host -p santree-remote-proto -p santree-remote-tls -p santree-agent-kind
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust toolchain and rustc 1.95
        run: |
          rustup show
          rustup toolchain install 1.95 --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Clippy
        run: |
          # shellcheck disable=SC2086 # ENGINE_CRATES splits into -p flags
          cargo clippy $ENGINE_CRATES --all-targets -- -D warnings

      - name: Tests
        run: |
          # shellcheck disable=SC2086 # ENGINE_CRATES splits into -p flags
          cargo test $ENGINE_CRATES

      # `+1.95` overrides rust-toolchain.toml for this one command.
      - name: Builds on rustc 1.95 (the crates' rust-version)
        run: |
          # shellcheck disable=SC2086 # ENGINE_CRATES splits into -p flags
          cargo +1.95 check $ENGINE_CRATES --all-targets

  # Nothing above ever packages the app, so bundle resources, the icon set and
  # the bundler only get exercised at release time — where a break is
  # discovered by hand. This builds the real .app, asserts its resources and
  # launches it (not a release pipeline: no signing, no upload, no tag — the
  # artifacts are thrown away). Main-branch-only because a bundle build is too
  # slow to gate every PR on.
  bundle-smoke:
    name: Bundle smoke (packaging + resources + launch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      # This job asks one question — does a bundle assemble, carry its resources
      # and launch — and none of it is about how fast the binary runs. With the
      # release profile's optimizer on, compiling the `santree` crate alone took
      # 6m24s of this job's ~9.5 min (thin LTO, 16 codegen units). The profile
      # stays `release` (panic = "abort", the `server` profile's unwind, no
      # debug-assertions), only the optimizer is off. Set as job env, not in a
      # profile, so `release.yml`, which builds what users install, keeps the
      # full settings; and at job level so rust-cache keys on them.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `app` only: the DMG's AppleScript layout is skipped under CI anyway.
      - name: Bundle
        run: pnpm tauri build --bundles app

      # The hook and the server are staged by `pnpm bundle:binaries` and copied
      # in as bundle resources; when the hook goes missing, session-state tracking
      # silently dies for every agent terminal, and without the server the
      # terminals never outlive the app — so assert both actually landed inside
      # the bundle.
      - name: Assert artifacts
        run: |
          app=target/release/bundle/macos/santree.app
          test -d "$app"
          test -x "$app/Contents/Resources/santree-hook"
          test -x "$app/Contents/Resources/santree-server"

      # The assertions above prove the bundle's *shape*; this proves it runs.
      # SANTREE_SMOKE makes the app exit 0 once its window has loaded (and fail
      # on a watchdog if it never does) — so a panic in setup or a frontend that
      # didn't make it into the bundle fails here rather than at release time.
      - name: Smoke-launch the bundle
        timeout-minutes: 5
        env:
          SANTREE_SMOKE: "1"
        run: |
          target/release/bundle/macos/santree.app/Contents/MacOS/santree
          # Same bar as release.yml: a smoke launch leaves no detached server.
          if pgrep -x santree-server > /dev/null; then
            pgrep -lf santree-server || true
            echo "::error::a santree-server outlived the smoke launch"
            exit 1
          fi
