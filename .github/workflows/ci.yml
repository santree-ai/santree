name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome: lint + format check + import sorting (same as `pnpm lint`).
      - run: pnpm lint

      # tsc --noEmit + production Vite build.
      - run: pnpm build

      - run: pnpm test

  backend:
    name: Backend (fmt · clippy · test · bindings drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri builds against the OS webview — WebKitGTK — so its dev libs are
      # required before the Rust side will compile (mirrors README's Linux deps).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The toolchain (stable + rustfmt + clippy) is pinned in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # `cargo test` re-runs the bindings export (export_bindings_succeeds), which
      # rewrites src/bindings.ts. If the committed file is stale, this fails —
      # forcing `pnpm gen:bindings` to be run + committed when a command changes.
      - name: Bindings are up to date
        run: git diff --exit-code src/bindings.ts
