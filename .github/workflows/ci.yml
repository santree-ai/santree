name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes back to the repo — CI only reads the checkout.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the `# vX.Y.Z` comment says
# which release it is). A version tag is mutable — whoever owns the action can
# repoint `v4` at new code, which then runs inside our checkout with our token. The
# SHA can't be repointed. Re-pin deliberately, don't float.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The app version is declared in three places that nothing keeps in sync:
      # package.json, tauri.conf.json (what Tauri stamps into the bundle) and the
      # workspace Cargo.toml (what the About box reads via `package_info()`). Drift
      # is invisible until a release ships a DMG whose metadata contradicts itself,
      # so guard it here — same idea as the bindings-drift check in the backend job.
      - name: Versions agree (package.json · tauri.conf.json · Cargo.toml)
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          # [workspace.package]'s `version` — the only line starting with `version =`
          # (dependency versions all sit inside inline tables).
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$crate"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$crate" ]; then
            echo "::error::app version disagrees across package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi

      # Version is read from package.json's `packageManager` field, so it
      # can't drift from what contributors get via corepack locally.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome: lint + format check + import sorting (same as `pnpm lint`).
      - run: pnpm lint

      # tsc --noEmit + production Vite build.
      - run: pnpm build

      # The screenshot and demo fixture worlds are dev-only by build-time
      # constants; prove the bundle that just built carries none of them.
      - run: pnpm check:no-demo

      # tsconfig.json excludes the test files, and vitest transpiles them with
      # esbuild (which strips types without checking them) — so without this they
      # are type-checked nowhere and drift silently against bindings.ts.
      - run: pnpm typecheck:test

      - run: pnpm test

  backend:
    name: Backend (fmt · clippy · test · bindings drift) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Tauri builds against the OS webview — WebKitGTK — so its dev libs are
      # required before the Rust side will compile (mirrors README's Linux deps).
      # macOS ships WebKit as part of the OS, so this step is Linux-only.
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The exact toolchain version + components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — the single source of truth. `rustup show` reads that
      # file and auto-installs the pinned toolchain if it isn't already present
      # (GitHub-hosted runners ship rustup + a floating "stable" by default, which
      # this overrides for every cargo invocation below).
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all --check

      # tauri.conf.json (and, on macOS, tauri.macos.conf.json) declares the hook
      # and the server binaries as bundle resources, and Tauri's build script
      # hard-errors ("resource path ... doesn't exist") when a declared resource
      # is missing — so every cargo command below needs them staged first.
      # The bundle jobs get this for free via `beforeBuildCommand` (`pnpm
      # bundle:binaries`); this job is pure cargo, so do the same build+copy here
      # rather than pulling node/pnpm into it. Debug is fine — nothing runs the
      # binaries, the build script only checks that the paths exist. Linux does
      # not declare the server, but stages it anyway: the step is one list, and
      # a platform that starts shipping it should not be the thing that breaks.
      - name: Stage the bundle resources
        run: |
          cargo build -p santree-hook -p santree-server
          mkdir -p target/bundle-resources
          cp target/debug/santree-hook target/debug/santree-server target/bundle-resources/

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` below runs this too; named on its own so a server
      # change without a REVISION bump fails with a legible step name. The fix is in
      # docs/server.md ("Versions and draining").
      - name: Server revision lock (REVISION matches the server's sources)
        run: cargo test -p santree-server --test revision

      - name: Tests
        run: cargo test --workspace

      # `cargo test` re-runs the bindings export (export_bindings_succeeds), which
      # rewrites src/bindings.ts. If the committed file is stale, this fails —
      # forcing `pnpm gen:bindings` to be run + committed when a command changes.
      # Only checked on one OS in the matrix — the export is platform-independent,
      # so running it on both would just duplicate the check.
      - name: Bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code src/bindings.ts

  # Nothing above ever packages the app, so bundle resources, the icon set, the
  # release profile's codegen and the platform bundlers only get exercised at
  # release time — where a break is discovered by hand. This builds the real
  # bundle and asserts the artifacts (not a release pipeline: no signing, no
  # upload, no tag — the artifacts are thrown away). Main-branch-only because a
  # full release build is far too slow to gate every PR on.
  bundle-smoke:
    name: Bundle smoke (packaging + resources) — ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Same WebKitGTK/GTK deps the backend job needs to compile, plus the ones
      # the .deb bundler shells out to.
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One bundler per OS: `app` and `deb` cover resource staging and the
      # release profile without the DMG's AppleScript layout (skipped under CI
      # anyway) or the AppImage's network-fetched tooling.
      - name: Bundle
        # This job asks one question — does a bundle assemble, carry its resources
        # and launch — and none of it is about how fast the binary runs. The release
        # profile's `lto = true` + `codegen-units = 1` buy runtime speed at a steep
        # link-time cost, and they dominated this job: on the worst observed run it
        # took 10m53s while both backend jobs finished under 3m, making it the whole
        # critical path. Thin LTO answers the same question in a fraction of the time.
        # Overridden per-step rather than in a profile so `release.yml`, which builds
        # what users actually install, keeps the full-fat settings untouched.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: pnpm tauri build --bundles ${{ matrix.os == 'macos-latest' && 'app' || 'deb' }}

      # The hook and the server are staged by `pnpm bundle:binaries` and copied
      # in as bundle resources; when the hook goes missing, session-state tracking
      # silently dies for every agent terminal, and without the server the
      # terminals never outlive the app — so assert both actually landed inside
      # the bundle. The server is macOS-only (tauri.macos.conf.json), so the deb
      # is asserted NOT to carry it: a Linux package shipping an unused binary
      # would mean the platform conf stopped being platform-specific.
      - name: Assert artifacts
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then
            app=target/release/bundle/macos/santree.app
            test -d "$app"
            test -x "$app/Contents/Resources/santree-hook"
            test -x "$app/Contents/Resources/santree-server"
          else
            deb=$(ls target/release/bundle/deb/*.deb)
            dpkg-deb -c "$deb" | grep -q '/santree-hook$'
            # (`! cmd` is exempt from `set -e`, so spell the failure out.)
            if dpkg-deb -c "$deb" | grep '/santree-server$' > /dev/null; then
              echo "::error::the deb carries santree-server; it is macOS-only"
              exit 1
            fi
          fi

      # The assertions above prove the bundle's *shape*; this proves it runs.
      # SANTREE_SMOKE makes the app exit 0 once its window has loaded (and fail
      # on a watchdog if it never does) — so a panic in setup or a frontend that
      # didn't make it into the bundle fails here rather than at release time.
      # macOS only: the Linux job has no display to open a window on.
      - name: Smoke-launch the bundle
        if: matrix.os == 'macos-latest'
        timeout-minutes: 5
        env:
          SANTREE_SMOKE: "1"
        run: |
          target/release/bundle/macos/santree.app/Contents/MacOS/santree
          # Same bar as release.yml: a smoke launch leaves no detached server.
          if pgrep -x santree-server > /dev/null; then
            pgrep -lf santree-server || true
            echo "::error::a santree-server outlived the smoke launch"
            exit 1
          fi
