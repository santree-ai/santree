name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes back to the repo — CI only reads the checkout.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the `# vX.Y.Z` comment says
# which release it is). A version tag is mutable — whoever owns the action can
# repoint `v4` at new code, which then runs inside our checkout with our token. The
# SHA can't be repointed. Re-pin deliberately, don't float.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The app version is declared in three places that nothing keeps in sync:
      # package.json, tauri.conf.json (what Tauri stamps into the bundle) and the
      # workspace Cargo.toml (what the About box reads via `package_info()`). Drift
      # is invisible until a release ships a DMG whose metadata contradicts itself,
      # so guard it here — same idea as the bindings-drift check in the backend job.
      - name: Versions agree (package.json · tauri.conf.json · Cargo.toml)
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          # [workspace.package]'s `version` — the only line starting with `version =`
          # (dependency versions all sit inside inline tables).
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$crate"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$crate" ]; then
            echo "::error::app version disagrees across package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi

      # Version is read from package.json's `packageManager` field, so it
      # can't drift from what contributors get via corepack locally.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome: lint + format check + import sorting (same as `pnpm lint`).
      - run: pnpm lint

      # tsc --noEmit + production Vite build.
      - run: pnpm build

      # tsconfig.json excludes the test files, and vitest transpiles them with
      # esbuild (which strips types without checking them) — so without this they
      # are type-checked nowhere and drift silently against bindings.ts.
      - run: pnpm typecheck:test

      - run: pnpm test

  backend:
    name: Backend (fmt · clippy · test · bindings drift) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Tauri builds against the OS webview — WebKitGTK — so its dev libs are
      # required before the Rust side will compile (mirrors README's Linux deps).
      # macOS ships WebKit as part of the OS, so this step is Linux-only.
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # The exact toolchain version + components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — the single source of truth. `rustup show` reads that
      # file and auto-installs the pinned toolchain if it isn't already present
      # (GitHub-hosted runners ship rustup + a floating "stable" by default, which
      # this overrides for every cargo invocation below).
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      # tauri.conf.json declares the hook binary as a bundle resource, and Tauri's
      # build script hard-errors ("resource path ... doesn't exist") when a declared
      # resource is missing — so every cargo command below needs it staged first.
      # The bundle jobs get this for free via `beforeBuildCommand` (`pnpm
      # bundle:hook`); this job is pure cargo, so do the same build+copy here
      # rather than pulling node/pnpm into it. Debug is fine — nothing runs the
      # binary, the build script only checks that the path exists.
      - name: Stage the hook bundle resource
        run: |
          cargo build -p santree-hook
          mkdir -p target/bundle-resources
          cp target/debug/santree-hook target/bundle-resources/santree-hook

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # `cargo test` re-runs the bindings export (export_bindings_succeeds), which
      # rewrites src/bindings.ts. If the committed file is stale, this fails —
      # forcing `pnpm gen:bindings` to be run + committed when a command changes.
      # Only checked on one OS in the matrix — the export is platform-independent,
      # so running it on both would just duplicate the check.
      - name: Bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code src/bindings.ts

  # Nothing above ever packages the app, so bundle resources, the icon set, the
  # release profile's codegen and the platform bundlers only get exercised at
  # release time — where a break is discovered by hand. This builds the real
  # bundle and asserts the artifacts (not a release pipeline: no signing, no
  # upload, no tag — the artifacts are thrown away). Main-branch-only because a
  # full release build is far too slow to gate every PR on.
  bundle-smoke:
    name: Bundle smoke (packaging + resources) — ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Same WebKitGTK/GTK deps the backend job needs to compile, plus the ones
      # the .deb bundler shells out to.
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One bundler per OS: `app` and `deb` cover resource staging and the
      # release profile without the DMG's AppleScript layout (skipped under CI
      # anyway) or the AppImage's network-fetched tooling.
      - name: Bundle
        run: pnpm tauri build --bundles ${{ matrix.os == 'macos-latest' && 'app' || 'deb' }}

      # The hook is staged by `pnpm bundle:hook` and copied in as a bundle
      # resource; when it goes missing, session-state tracking silently dies for
      # every agent terminal — so assert it actually landed inside the bundle.
      - name: Assert artifacts
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then
            app=target/release/bundle/macos/santree.app
            test -d "$app"
            test -x "$app/Contents/Resources/santree-hook"
          else
            deb=$(ls target/release/bundle/deb/*.deb)
            dpkg-deb -c "$deb" | grep -q '/santree-hook$'
          fi
