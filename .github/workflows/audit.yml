name: Dependency Audit

# Scheduled rather than PR-gated: new advisories can appear against a pinned
# version with no code change on our side, so gating every PR on this would
# fail builds for reasons unrelated to the PR's content. Running weekly (plus
# on-demand) surfaces newly-disclosed RustSec/npm advisories without blocking
# day-to-day CI.
on:
  schedule:
    - cron: "0 8 * * 1" # every Monday, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads a prebuilt binary and checks Cargo.lock — no compiling the
      # workspace, so it's fast even though it runs against 650+ crates.
      # On schedule/dispatch runs it files a GitHub issue per new advisory
      # instead of failing the run outright.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: pnpm audit (npm advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is read from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --prod: dev-only tooling (Biome, Vite, Vitest, …) never ships in the
      # built app, so advisories there aren't worth paging anyone over.
      - name: pnpm audit
        id: audit
        continue-on-error: true
        # pipefail: without it the pipe would mask pnpm's non-zero exit with tee's 0.
        run: |
          set -o pipefail
          pnpm audit --prod | tee audit.txt

      # Mirrors what rustsec/audit-check does for the Rust half: a failing
      # scheduled run has no PR to annotate, so the advisories land as a GitHub
      # issue instead of a red run nobody sees. One rolling issue, re-bodied on
      # each run, so a still-unfixed advisory doesn't file a duplicate weekly.
      - name: File advisories as an issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='pnpm audit: advisories in production dependencies'
          # The backticks are markdown fences, hence the escaping.
          body=$(printf "\`pnpm audit --prod\` failed in [this run](%s/%s/actions/runs/%s).\n\n\`\`\`\n%s\n\`\`\`\n" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(head -c 50000 audit.txt)")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
