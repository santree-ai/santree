<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="36%" r="80%">
      <stop offset="0" stop-color="#16332c"/>
      <stop offset="1" stop-color="#080f0d"/>
    </radialGradient>
    <linearGradient id="emerald" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#c8f6e7"/>
      <stop offset="0.24" stop-color="#4fd4ad"/>
      <stop offset="0.47" stop-color="#e2fff5"/>
      <stop offset="0.6"  stop-color="#1f9c7d"/>
      <stop offset="0.8"  stop-color="#5fceac"/>
      <stop offset="1"    stop-color="#0c6f59"/>
    </linearGradient>
    <linearGradient id="sheen2" x1="256" y1="120" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade2" x1="256" y1="300" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#022a20" stop-opacity="0"/>
      <stop offset="1" stop-color="#022a20" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="drop2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Inset the full-bleed 512 artwork into Apple's icon grid: an 824x824 body
       centered in the 1024 canvas (~100px / ~10% transparent margin each side),
       so it renders at the same visual size as native macOS icons. -->
  <g transform="translate(100,100) scale(1.609375)">
    <rect width="512" height="512" rx="112" fill="url(#bg2)"/>

    <g filter="url(#drop2)">
      <g fill="url(#emerald)">
        <path d="M256 128 L173 232 L339 232 Z"/>
        <path d="M256 248 L148 384 L364 384 Z"/>
      </g>
      <g fill="url(#shade2)">
        <path d="M256 128 L173 232 L339 232 Z"/>
        <path d="M256 248 L148 384 L364 384 Z"/>
      </g>
      <g fill="url(#sheen2)">
        <path d="M256 128 L173 232 L339 232 Z"/>
        <path d="M256 248 L148 384 L364 384 Z"/>
      </g>
    </g>
  </g>
</svg>
