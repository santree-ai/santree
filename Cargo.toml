[workspace]
members = [
    "src-tauri",
    "crates/core",
    "crates/agent-kind",
    "crates/pty",
    "crates/hook",
    "crates/remote-proto",
    "crates/remote-tls",
    "crates/remote",
    "crates/host",
    "crates/server",
]
resolver = "2"

# Shared dependency versions for the whole workspace. Member crates pull these
# in with `dep = { workspace = true }` so versions stay in lockstep.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# The app and the hook binary must link exactly one libsqlite3-sys: `links =
# "sqlite3"` allows only one copy in the graph, so a version drift between the
# two crates is a hard build failure. Pinning here makes that structural.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", default-features = false }
portable-pty = "0.9"
anyhow = "1"
log = "0.4"

[workspace.package]
edition = "2021"
version = "0.1.19-beta.5"
license = "MIT"

# The shipped desktop binary (what actually goes in the DMG/AppImage): trade
# build time for a smaller, faster release artifact. Only paid in CI/release
# builds — `tauri dev` still uses Cargo's normal (fast-compiling) dev profile.
[profile.release]
codegen-units = 1
lto = true
# …except for debuginfo. `panic = "abort"` gives us exactly one chance to record a
# crash: the panic hook in lib.rs, which logs a backtrace before the process dies.
# Stripping the symbol table would reduce that backtrace to a column of hex
# addresses, which is not a crash report. Line tables (`debug = 1`) + an unstripped
# symbol table are what make it resolve to real frames.
debug = 1
strip = false
panic = "abort"
opt-level = "s"

# The santree server (`cargo build --profile server -p santree-server`): the
# release profile, except that a panic unwinds. Under the workspace's `abort` a
# panic in any request handler would take the whole server down, and with it
# every terminal it holds (each shell gets SIGHUP). Unwinding, santree-host
# catches it at the request, answers `io` and serves on.
[profile.server]
inherits = "release"
panic = "unwind"
