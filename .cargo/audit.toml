# cargo-audit configuration (read by `cargo audit` and by rustsec/audit-check in
# .github/workflows/audit.yml).
#
# `cargo audit` scans Cargo.lock, and Cargo.lock is deliberately feature-agnostic:
# it resolves the *optional* dependencies of every crate in the graph whether or
# not the feature that enables them is on. So a crate can sit in the lockfile —
# and get flagged — without ever reaching a compiler, let alone the shipped binary.
#
# An ignore here is only ever justified for that case, and only with proof:
# `cargo tree -i <crate> --target all` must print nothing. Anything that actually
# compiles gets fixed or upgraded, never ignored — an audit that's permanently red
# teaches everyone to skip the one that matters.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in `rsa`. There is no
    # fixed release ("No fixed upgrade is available!"), so it cannot be resolved by
    # bumping.
    #
    # It is not compiled into santree. `rsa` is an optional dependency of
    # `sqlx-mysql`, which is itself an optional dependency of the `sqlx` facade
    # crate. We depend on sqlx with `default-features = false` and only the
    # sqlite/tokio/migrate/macros features (see the workspace Cargo.toml), so the
    # MySQL driver is never enabled — but the lockfile records it anyway.
    #
    # Verified, on this lockfile:
    #     $ cargo tree -i rsa --target all
    #     warning: nothing to print.
    #     $ cargo tree -i sqlx-mysql --target all
    #     warning: nothing to print.
    #
    # The only way to get it out of the lockfile entirely is to drop the `sqlx`
    # facade for `sqlx-core` + `sqlx-sqlite` directly, which is not worth the churn
    # for a crate that never links. Re-check this if we ever add a sqlx feature.
    "RUSTSEC-2023-0071",
]
