[package]
name = "santree-remote-tls"
description = "The pinned TLS 1.3 profile of the santree <-> daedalus session-host link: ed25519 identities, self-signed certificates, raw-key pinning."
edition.workspace = true
version.workspace = true
license.workspace = true
# The daedalus engine builds this crate with nix on rustc 1.95.
rust-version = "1.95"

# Consumed outside this workspace: the daedalus engine's session host depends on
# this crate by git rev, so both ends of the link build their TLS from the same
# code. Its public API and its dependency list are a contract — no santree-core,
# no specta, and ring as the ONLY crypto provider (no aws-lc-rs anywhere in its
# tree, and never the process-default provider).

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio = { workspace = true }
ring = "0.17"
# The pin comparison, in constant time.
subtle = "2"

[dev-dependencies]
# TLS 1.2 exists in the tests alone, to prove a 1.2-only peer is refused.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
