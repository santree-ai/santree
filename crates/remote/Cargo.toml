[package]
name = "santree-remote-client"
description = "Client for a Daedalus session host (protocol v1) through the local Daedalus agent: typed JSON-lines client, reconnecting host — Tauri-agnostic."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# An in-process daemon speaking protocol v1 over an in-memory link: the
# production host (`santree-host`) with test controls. For tests — this
# crate's own and the app's dispatch tests — never for shipping.
fake = ["dep:santree-host", "santree-host/test-support"]

[dependencies]
# Protocol v1's types, re-exported as `proto`.
santree-remote-proto = { path = "../remote-proto" }
santree-host = { path = "../host", optional = true }
serde = { workspace = true }
# `raw_value` so a frame's payload is decoded once, by the caller that knows its
# type, instead of through an intermediate `Value` tree.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
thiserror = "2"
log = { workspace = true }

[dev-dependencies]
# The `fake` module is also compiled for this crate's own unit tests.
santree-host = { path = "../host", features = ["test-support"] }
santree-pty = { path = "../pty" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
tempfile = "3"
