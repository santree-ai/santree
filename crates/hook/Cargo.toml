[package]
name = "santree-hook"
description = "Tiny CLI that Claude Code hooks invoke to record santree session-state events."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "santree-hook"
path = "src/main.rs"

[dependencies]
# Already in the graph via santree-core; named here because the MCP tools
# deserialize the model's arguments straight into the domain types.
serde = { workspace = true }
serde_json = { workspace = true }
# For `AgentState` — the state vocabulary is defined once in the domain crate so
# this binary (the producer) and the app (the consumer) can't drift apart.
santree-core = { path = "../core" }
# Same SQLite driver + version as the app so both processes link one
# libsqlite3-sys (rusqlite would pull a second, and `links = "sqlite3"` allows
# only one in the graph) — pinned in [workspace.dependencies] so it can't drift.
# A one-shot insert on a current-thread runtime.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
