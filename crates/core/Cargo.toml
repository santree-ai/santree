[package]
name = "santree-core"
description = "Pure domain logic for santree — no Tauri dependency, fully unit-testable."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "santree_core"

[dependencies]
serde = { workspace = true }
# `specta::Type` is derived here so domain structs can cross the typed bridge
# without the command layer having to redefine them.
specta = { workspace = true }
# `AgentKind`, re-exported from `domain`. Its `specta` feature is on here, and
# only here, so the domain structs that carry one can derive `Type`.
santree-agent-kind = { path = "../agent-kind", features = ["specta"] }
# The Conversation view's transcript parser (`conversation::claude`) reads the
# agent's JSON Lines record and its RFC 3339 timestamps.
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
